name: Build Android
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unzip project
        run: unzip -q mavijan-dino-run-android.zip -d app
      - name: Install Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Create Android project
        working-directory: app
        run: |
          npm install
          npm run android:setup
      - name: Signing key
        working-directory: app
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "Add the KEYSTORE_PASSWORD secret first"; exit 1; fi
          keytool -genkeypair -v -storetype PKCS12 -keystore mavijan-upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Mavijan, O=Mavijan, C=US"
          printf "storeFile=../mavijan-upload.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n" "$KS_PASS" "$KS_PASS" > android/keystore.properties
      - name: Build AAB and APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew clean bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: mavijan-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mavijan-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: app/mavijan-upload.jks
